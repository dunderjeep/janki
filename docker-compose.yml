services:

  # ── PostgreSQL 16 (the PostGIS image, so spatial apps can use it) ─────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: janki_postgres
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    command: >
      postgres
      -c shared_buffers=96MB
      -c work_mem=4MB
      -c maintenance_work_mem=48MB
      -c max_connections=30
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-janki}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-janki}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin 4 (database GUI) ────────────────────────────────────────────────
  # Opt-in only: `docker compose --profile tools up -d pgadmin`. Costs ~250MB
  # idle, and psql/drizzle-studio cover most of what it's used for.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: janki_pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:-admin@example.edu}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme}
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  # ── MinIO (S3-compatible object storage for images/audio) ────────────────────
  minio:
    image: minio/minio:latest
    container_name: janki_minio
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9002}:9000"        # S3 API
      - "${MINIO_CONSOLE_PORT:-9003}:9001" # MinIO Console UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── MinIO bucket init (runs once, creates janki-media bucket) ────────────────
  minio-init:
    image: minio/mc:latest
    container_name: janki_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        until mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin}; do sleep 2; done;
        mc mb local/janki-media --ignore-existing;
        mc anonymous set download local/janki-media;
        echo 'Bucket janki-media ready with public read access.';
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}

volumes:
  postgres_data:
  pgadmin_data:
  minio_data:
