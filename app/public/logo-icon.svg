  <!-- Card content lines -->
  <rect x="15" y="14" width="16" height="2.5" rx="1.25" fill="#6366f1" opacity="0.55"/>
  <rect x="15" y="20" width="12" height="2.5" rx="1.25" fill="#6366f1" opacity="0.35"/>
  <rect x="15" y="26" width="14" height="2.5" rx="1.25" fill="#6366f1" opacity="0.35"/>
  <rect x="15" y="32" width="9"  height="2.5" rx="1.25" fill="#6366f1" opacity="0.2"/>
  <!-- Graph node connector -->
  <line x1="33" y1="11" x2="40" y2="7" stroke="#f43f5e" stroke-width="1.5" opacity="0.7"/>
  <circle cx="43" cy="18" r="2.5" fill="#f43f5e" opacity="0.5"/>
  <line x1="40" y1="7" x2="43" y2="15.5" stroke="#f43f5e" stroke-width="1.5" opacity="0.5"/>
  <circle cx="40" cy="6" r="4" fill="#f43f5e"/>
</svg>
